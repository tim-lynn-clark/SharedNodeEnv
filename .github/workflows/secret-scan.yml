name: Secret Scan

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  # Pinned deliberately. The official gitleaks-action requires a license key
  # for GitHub organizations and needs a workflow token; a pinned release
  # binary has neither requirement and is reproducible.
  GITLEAKS_VERSION: 8.30.1

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Required. actions/checkout defaults to a shallow clone, which would
          # leave gitleaks scanning a single commit and reporting a confident
          # all-clear. This is the most common way a secret-scanning workflow
          # ends up being decorative.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location "$url" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan full history
        run: |
          # --redact keeps a detected secret out of the build log. Logs on a
          # public repository are world-readable, so printing the finding
          # verbatim would turn a caught leak into a published one.
          gitleaks git \
            --no-banner \
            --redact \
            --config .gitleaks.toml \
            --report-format sarif \
            --report-path gitleaks.sarif \
            .

      - name: Upload findings
        # Runs even on failure: the report is most useful precisely when the
        # scan fails, and --redact means the artifact is safe to retain.
        if: always()
        # v6, not v5: upload-artifact@v5 still runs on the deprecated node20
        # runtime, so bumping only to v5 would leave the deprecation warning
        # in place. checkout reached node24 at v5.
        uses: actions/upload-artifact@v6
        with:
          name: gitleaks-report
          path: gitleaks.sarif
          if-no-files-found: ignore
          retention-days: 7
